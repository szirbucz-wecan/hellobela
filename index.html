<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Béla</title>
    <style>
        /* A teljes képernyőt lefedjük, és kivesszük az alapértelmezett margókat */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Flexbox segítségével függőlegesen és vízszintesen is középre igazítunk */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5; /* Egy kellemes, világosszürke háttér */
            font-family: 'Arial', sans-serif;
        }

        /* A szöveg formázása */
        h1 {
            font-size: 3rem;
            color: #333333;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>Hello Béla!</h1>

</body>
</html>
